<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" role="img" aria-label="Store POS feature overview">
  <defs>
    <radialGradient id="bg" cx="28%" cy="0%" r="120%">
      <stop offset="0%" stop-color="#141d3a"/><stop offset="55%" stop-color="#0a0f1e"/><stop offset="100%" stop-color="#070b16"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/><stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <style>
      .glyph { fill: none; stroke: #ffffff; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .ct { font-size: 16px; font-weight: 700; fill: #eef2f8; }
      .cd { font-size: 12.5px; fill: #93a0ba; }
      .badge { font-size: 15px; font-weight: 600; fill: #d6ddec; }
    </style>
  </defs>

  <rect width="1280" height="820" fill="url(#bg)"/>
  <rect x="0" y="0" width="1280" height="6" fill="url(#accent)"/>

  <!-- Header -->
  <g transform="translate(60,48)">
    <rect width="64" height="64" rx="18" fill="url(#accent)"/>
    <g class="glyph" transform="translate(14,14) scale(1.5)">
      <path d="M4 9l2-5h12l2 5"/><path d="M4 9h16v11H4z"/><path d="M9 20v-6h6v6"/>
    </g>
  </g>
  <text x="142" y="86" font-size="38" font-weight="800" fill="#eef2f8" letter-spacing="-0.5">Store POS</text>
  <text x="143" y="118" font-size="17" fill="#8a94ad">Offline-first point of sale for small stores — fast, secure, bilingual.</text>
  <text x="1220" y="78" text-anchor="end" font-size="14" font-weight="600" fill="#8a94ad">Feature Overview</text>
  <line x1="60" y1="150" x2="1220" y2="150" stroke="#1f2a4d"/>

  <!-- Feature cards -->
  <g transform="translate(60,182)">
    <rect width="275" height="146" rx="14" fill="#111830" stroke="#1f2a4d"/>
    <rect x="18" y="16" width="40" height="40" rx="11" fill="url(#accent)"/>
    <g class="glyph" transform="translate(20,18) scale(1.5)"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2 3h3l2.4 12.4a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.6L22 7H6"/></g>
    <text class="ct" x="18" y="84">Fast Checkout</text>
    <text class="cd" x="18" y="108">Barcode scan, instant search</text>
    <text class="cd" x="18" y="128">and keyboard shortcuts.</text>
  </g>
  <g transform="translate(355,182)">
    <rect width="275" height="146" rx="14" fill="#111830" stroke="#1f2a4d"/>
    <rect x="18" y="16" width="40" height="40" rx="11" fill="url(#accent)"/>
    <g class="glyph" transform="translate(20,18) scale(1.5)"><path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4"/><path d="M12 11v10"/></g>
    <text class="ct" x="18" y="84">Products &amp; Inventory</text>
    <text class="cd" x="18" y="108">Catalog, categories, reorder</text>
    <text class="cd" x="18" y="128">levels and stock ledger.</text>
  </g>
  <g transform="translate(650,182)">
    <rect width="275" height="146" rx="14" fill="#111830" stroke="#1f2a4d"/>
    <rect x="18" y="16" width="40" height="40" rx="11" fill="url(#accent)"/>
    <g class="glyph" transform="translate(20,18) scale(1.5)"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2z"/><path d="M9 7h6M9 11h6M9 15h4"/></g>
    <text class="ct" x="18" y="84">Sales &amp; Refunds</text>
    <text class="cd" x="18" y="108">History, void sales and</text>
    <text class="cd" x="18" y="128">item-level refunds.</text>
  </g>
  <g transform="translate(945,182)">
    <rect width="275" height="146" rx="14" fill="#111830" stroke="#1f2a4d"/>
    <rect x="18" y="16" width="40" height="40" rx="11" fill="url(#accent)"/>
    <g class="glyph" transform="translate(20,18) scale(1.5)"><path d="M6 9V3h12v6"/><path d="M6 18H4a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></g>
    <text class="ct" x="18" y="84">Receipts &amp; Printing</text>
    <text class="cd" x="18" y="108">80mm thermal and A4 with</text>
    <text class="cd" x="18" y="128">logo and tax breakdown.</text>
  </g>

  <g transform="translate(60,346)">
    <rect width="275" height="146" rx="14" fill="#111830" stroke="#1f2a4d"/>
    <rect x="18" y="16" width="40" height="40" rx="11" fill="url(#accent)"/>
    <g class="glyph" transform="translate(20,18) scale(1.5)"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></g>
    <text class="ct" x="18" y="84">Customers &amp; Credit</text>
    <text class="cd" x="18" y="108">Credit tabs, ledger and</text>
    <text class="cd" x="18" y="128">debt collection.</text>
  </g>
  <g transform="translate(355,346)">
    <rect width="275" height="146" rx="14" fill="#111830" stroke="#1f2a4d"/>
    <rect x="18" y="16" width="40" height="40" rx="11" fill="url(#accent)"/>
    <g class="glyph" transform="translate(20,18) scale(1.5)"><path d="M1 3h13v13H1z"/><path d="M14 8h4l3 3v5h-7z"/><circle cx="6" cy="18" r="1.6"/><circle cx="18" cy="18" r="1.6"/></g>
    <text class="ct" x="18" y="84">Suppliers &amp; Purchases</text>
    <text class="cd" x="18" y="108">Supplier invoices, stock-in</text>
    <text class="cd" x="18" y="128">and payable tracking.</text>
  </g>
  <g transform="translate(650,346)">
    <rect width="275" height="146" rx="14" fill="#111830" stroke="#1f2a4d"/>
    <rect x="18" y="16" width="40" height="40" rx="11" fill="url(#accent)"/>
    <g class="glyph" transform="translate(20,18) scale(1.5)"><path d="M3 21h18"/><rect x="5" y="12" width="3" height="7" rx="0.5"/><rect x="10.5" y="8" width="3" height="11" rx="0.5"/><rect x="16" y="4" width="3" height="15" rx="0.5"/></g>
    <text class="ct" x="18" y="84">Reports &amp; Analytics</text>
    <text class="cd" x="18" y="108">Revenue, margins, trends</text>
    <text class="cd" x="18" y="128">and category charts.</text>
  </g>
  <g transform="translate(945,346)">
    <rect width="275" height="146" rx="14" fill="#111830" stroke="#1f2a4d"/>
    <rect x="18" y="16" width="40" height="40" rx="11" fill="url(#accent)"/>
    <g class="glyph" transform="translate(20,18) scale(1.5)"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></g>
    <text class="ct" x="18" y="84">Register Sessions</text>
    <text class="cd" x="18" y="108">Open/close shifts with</text>
    <text class="cd" x="18" y="128">cash variance tracking.</text>
  </g>

  <g transform="translate(60,510)">
    <rect width="275" height="146" rx="14" fill="#111830" stroke="#1f2a4d"/>
    <rect x="18" y="16" width="40" height="40" rx="11" fill="url(#accent)"/>
    <g class="glyph" transform="translate(20,18) scale(1.5)"><path d="M12 2l8 3v6c0 5-3.5 8.5-8 11-4.5-2.5-8-6-8-11V5z"/><path d="M9 12l2 2 4-4"/></g>
    <text class="ct" x="18" y="84">Users &amp; Permissions</text>
    <text class="cd" x="18" y="108">Roles, granular permissions</text>
    <text class="cd" x="18" y="128">and audit logging.</text>
  </g>
  <g transform="translate(355,510)">
    <rect width="275" height="146" rx="14" fill="#111830" stroke="#1f2a4d"/>
    <rect x="18" y="16" width="40" height="40" rx="11" fill="url(#accent)"/>
    <g class="glyph" transform="translate(20,18) scale(1.5)"><rect x="2" y="6" width="20" height="14" rx="2"/><path d="M2 10h20"/><circle cx="17" cy="15" r="1.2"/></g>
    <text class="ct" x="18" y="84">Expenses &amp; Withdrawals</text>
    <text class="cd" x="18" y="108">Expense categories and cash</text>
    <text class="cd" x="18" y="128">drawer withdrawals.</text>
  </g>
  <g transform="translate(650,510)">
    <rect width="275" height="146" rx="14" fill="#111830" stroke="#1f2a4d"/>
    <rect x="18" y="16" width="40" height="40" rx="11" fill="url(#accent)"/>
    <g class="glyph" transform="translate(20,18) scale(1.5)"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18 14 14 0 0 1 0-18"/></g>
    <text class="ct" x="18" y="84">Bilingual &amp; Themed</text>
    <text class="cd" x="18" y="108">English &amp; العربية with RTL,</text>
    <text class="cd" x="18" y="128">dark and light modes.</text>
  </g>
  <g transform="translate(945,510)">
    <rect width="275" height="146" rx="14" fill="#111830" stroke="#1f2a4d"/>
    <rect x="18" y="16" width="40" height="40" rx="11" fill="url(#accent)"/>
    <g class="glyph" transform="translate(20,18) scale(1.5)"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></g>
    <text class="ct" x="18" y="84">Offline &amp; Backups</text>
    <text class="cd" x="18" y="108">Local SQLite, auto backups</text>
    <text class="cd" x="18" y="128">and full Excel export.</text>
  </g>

  <!-- Footer badges -->
  <g transform="translate(60,676)">
    <rect width="1160" height="80" rx="16" fill="#111830" stroke="#1f2a4d"/>
    <line x1="290" y1="22" x2="290" y2="58" stroke="#1f2a4d"/>
    <line x1="580" y1="22" x2="580" y2="58" stroke="#1f2a4d"/>
    <line x1="870" y1="22" x2="870" y2="58" stroke="#1f2a4d"/>
    <circle cx="30" cy="40" r="7" fill="#22c55e"/>
    <text class="badge" x="52" y="45">Offline-first · no internet</text>
    <circle cx="320" cy="40" r="7" fill="#22d3ee"/>
    <text class="badge" x="342" y="45">Bilingual English / العربية</text>
    <circle cx="610" cy="40" r="7" fill="#6366f1"/>
    <text class="badge" x="632" y="45">Role-based security &amp; audit</text>
    <circle cx="900" cy="40" r="7" fill="#f59e0b"/>
    <text class="badge" x="922" y="45">Windows · macOS · Linux</text>
  </g>

  <line x1="60" y1="776" x2="1220" y2="776" stroke="#1f2a4d"/>
  <text x="60" y="802" font-size="13.5" fill="#5c6884">Store POS · Offline-first point of sale</text>
  <text x="1220" y="802" text-anchor="end" font-size="13.5" fill="#5c6884">© Mohammad Aljamal — All Rights Reserved</text>
</svg>
